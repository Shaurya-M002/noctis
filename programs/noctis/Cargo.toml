[package]
name = "noctis"
version = "0.1.0"
description = "Fair value and reopen assurance for tokenized equities while the primary venue is shut"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "noctis"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
