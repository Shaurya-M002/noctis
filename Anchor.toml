[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
noctis = "NoCTajFqJn1QScfX3KozwSitGzcVf6muHLKXoKQhbhE"

[programs.devnet]
noctis = "NoCTajFqJn1QScfX3KozwSitGzcVf6muHLKXoKQhbhE"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "http://127.0.0.1:8917"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# 8899 is often already taken on a dev machine; keep the test validator out of the way.
[test.validator]
rpc_port = 8917
faucet_port = 9918
